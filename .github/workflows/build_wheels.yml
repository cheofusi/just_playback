name: Build Wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.sdist.outputs.filename }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Validate source distribution
        id: sdist
        shell: python
        run: |
          import os
          import tarfile
          from pathlib import Path

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found {len(archives)}")

          archive = archives[0]
          with tarfile.open(archive, "r:gz") as source_distribution:
              members = set(source_distribution.getnames())

          if any("/build/native/" in member for member in members):
              raise SystemExit("the sdist contains generated native build output")

          required = {
              "native/opus-deps.json",
              "native/opus/CMakeLists.txt",
              "tests/check_wheel.py",
              "tests/data/tiny-mp3.mp3.b64",
              "tests/data/tiny-flac.flac.b64",
              "tests/data/tiny-vorbis.ogg.b64",
              "tests/data/tiny-opus.ogg.b64",
              "tools/prepare_opus_deps.py",
          }
          missing = sorted(
              required_path
              for required_path in required
              if not any(
                  member.endswith(f"/{required_path}") for member in members
              )
          )
          if missing:
              raise SystemExit(f"the sdist is missing: {', '.join(missing)}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"filename={archive.name}", file=output)

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is an Intel runner, macos-14 is Apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]

    steps:
      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: cibw-sdist
          path: dist

      - name: Build wheels from source distribution
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: ./dist/${{ needs.build_sdist.outputs.filename }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
